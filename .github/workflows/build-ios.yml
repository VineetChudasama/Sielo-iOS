name: Build Sielo iOS (.ipa)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'apps.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Sielo.xcodeproj -scheme Sielo

      - name: Build Unsigned iOS App
        run: |
          set -o pipefail
          xcodebuild \
            -project Sielo.xcodeproj \
            -scheme Sielo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log || {
              echo "=== COMPILER ERRORS ==="
              grep -E "error:|fatal error:" build.log | head -n 40
              exit 1
            }

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sielo.app Payload/Sielo.app
          zip -r Sielo-iOS.ipa Payload

      - name: Upload Sielo-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sielo-iOS-IPA
          path: Sielo-iOS.ipa
          retention-days: 14

      - name: Publish GitHub Release & SideStore Source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v12.0.0-${GITHUB_RUN_NUMBER}"
          IPA_SIZE=$(stat -f%z Sielo-iOS.ipa)
          DATE_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Sielo-iOS.ipa"

          gh release create "$TAG" Sielo-iOS.ipa \
            --title "Sielo iOS $TAG" \
            --notes "Automated iOS build from commit ${GITHUB_SHA::7}"

          cat <<EOF > apps.json
          {
            "name": "Sielo iOS",
            "identifier": "com.sielo.music.source",
            "apps": [
              {
                "name": "Sielo",
                "bundleIdentifier": "com.sielo.music",
                "developerName": "Vineet Chudasama",
                "subtitle": "Tactile, lossless music streaming",
                "version": "12.0.${GITHUB_RUN_NUMBER}",
                "versionDate": "${DATE_ISO}",
                "versionDescription": "Automated build (${GITHUB_SHA::7})",
                "downloadURL": "${DOWNLOAD_URL}",
                "localizedDescription": "Tactile lossless music streaming with E2EE Listen Together, Vibe Radar, and synced lyrics.",
                "size": ${IPA_SIZE},
                "minOSVersion": "16.0"
              }
            ]
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update SideStore source apps.json ($TAG)"
          git push
